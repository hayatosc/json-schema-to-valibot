name: Release and Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10.12.1
    
    - name: Install dependencies
      run: pnpm install
    
    - name: Run type checking
      run: pnpm typecheck
    
    - name: Run linting
      run: pnpm lint
    
    - name: Run tests
      run: pnpm test:dev
    
    - name: Build project
      run: pnpm build
    
    - name: Run E2E tests
      run: pnpm test:e2e
    
    # npm trusted publishing (OIDC) requires npm >= 11.5.1
    - name: Update npm
      run: npm install -g npm@latest

    - name: Publish to npm
      run: npm publish --provenance --access public